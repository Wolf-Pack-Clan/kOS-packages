name: QalamIME

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build-qalamime:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup environment
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          sed coreutils rustup cmake fcitx5 libfcitx5config-dev libfcitx5core-dev \
          devscripts fakeroot dpkg-dev git extra-cmake-modules g++ libfcitx5utils-dev \

        rustup default stable

        git clone https://gitlab.com/kazamOS/qalamime.git --depth=1

    - name: Build
      env:
        DEBEMAIL: kazam0180@proton.me
        DEBFULLNAME: Kazam
        DEBIAN_FRONTEND: noninteractive
      run: |
        mkdir -p qlm-install/usr/lib/x86_64-linux-gnu

        SRCDIR="qalamime"
        echo "SRCDIR=${SRCDIR}" >> $GITHUB_ENV

        cd "$SRCDIR"
        latestTag=$(git describe --tags $(git rev-list --tags --max-count=1))
        git checkout $latestTag
        patch -p1 < ../patches/qalamime/cxx20.diff

        cargo build --release
        cmake -S cpp -B cpp/build --install-prefix $(realpath ../qlm-install/usr/)
        cmake --build cpp/build
        cmake --install cpp/build
        cp target/release/libqalamime_core.so ../qlm-install/usr/lib/x86_64-linux-gnu
        mv ../qlm-install/usr/lib/fcitx5 ../qlm-install/usr/lib/x86_64-linux-gnu/

        cd ..
        insize=$(du -sk qlm-install | cut -f1)

        mkdir -p deb-pkg/DEBIAN
        mkdir -p deb-pkg/usr/share/icons/
        cp -t deb-pkg/ -r qlm-install/*

        cat > deb-pkg/DEBIAN/control << EOF
        Package: fcitx-qalam
        Version: $latestTag
        Architecture: all
        Section: x11
        Maintainer: Kazam <kazam0180@proton.me>
        Priority: optional
        Installed-Size: $insize
        Description: Context-sensitive completion for English and Urdu on GNU/Linux
        EOF

        dpkg-deb --build deb-pkg fcitx-qalam_$latestTag.deb

        # Move artifacts
        mkdir -p artifacts
        mv fcitx-qalam_$latestTag.deb artifacts/ 2>/dev/null || echo "No deb files found"
        echo "$latestTag" >> artifacts/tag

        echo "Build completed"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fcitx-qalam-deb
        path: artifacts/fcitx*.deb
        retention-days: 7

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fcitx-qalam-tag
        path: artifacts/tag
        retention-days: 7

