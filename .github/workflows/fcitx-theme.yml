name: Fcitx5 kazamOS Theme

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build-theme:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup environment
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          sed coreutils devscripts fakeroot dpkg-dev git \

        git clone https://gitlab.com/kazamOS/fcitx-theme.git --depth=1

    - name: Build
      env:
        DEBEMAIL: kazam0180@proton.me
        DEBFULLNAME: Kazam
        DEBIAN_FRONTEND: noninteractive
      run: |
        mkdir -p qlm-install/usr/lib

        SRCDIR="fcitx-theme"
        echo "SRCDIR=${SRCDIR}" >> $GITHUB_ENV

        cd "$SRCDIR"
        latestTag=$(git describe --tags $(git rev-list --tags --max-count=1))
        git checkout $latestTag
        rm -rf .git
        cd ..

        insize=$(du -sk $SRCDIR | cut -f1)

        mkdir -p deb-pkg/DEBIAN
        mkdir -p deb-pkg/usr/share/fcitx5/themes
        cp -t deb-pkg/usr/share/fcitx5/themes/ -r $SRCDIR/kOS-dark $SRCDIR/kOS-light

        cat > deb-pkg/DEBIAN/control << EOF
        Package: fcitx-kos-theme
        Version: $latestTag
        Architecture: all
        Section: x11
        Maintainer: Kazam <kazam0180@proton.me>
        Priority: optional
        Installed-Size: $insize
        Description: Fcitx5 theme for kazamOS, based on fcitx-nord
        EOF

        dpkg-deb --build deb-pkg fcitx-kos-theme_$latestTag.deb

        # Move artifacts
        mkdir -p artifacts
        mv fcitx-kos-theme_$latestTag.deb artifacts/ 2>/dev/null || echo "No deb files found"
        echo "$latestTag" >> artifacts/tag

        echo "Build completed"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fcitx-kos-theme-deb
        path: artifacts/fcitx*.deb
        retention-days: 7

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fcitx-kos-theme-tag
        path: artifacts/tag
        retention-days: 7

