name: Tela Circle Manjaro

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build-tela-icon-theme:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup environment
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          sed coreutils gtk-update-icon-cache \
          devscripts fakeroot dpkg-dev git \

        git clone https://github.com/vinceliuice/Tela-circle-icon-theme.git

    - name: Build Icon Theme
      env:
        DEBEMAIL: kazam0180@proton.me
        DEBFULLNAME: Kazam
        DEBIAN_FRONTEND: noninteractive
      run: |

        SRCDIR="Tela-circle-icon-theme"
        echo "SRCDIR=${SRCDIR}" >> $GITHUB_ENV

        cd "$SRCDIR"
        latestTag=$(date +'%d.%m.%Y')

        (./install.sh -d ../telaicons manjaro)

        cd ..
        mkdir -p deb-pkg/DEBIAN
        mkdir -p deb-pkg/usr/share/icons/
        cp -r telaicons/* deb-pkg/usr/share/icons/

        cat > deb-pkg/DEBIAN/control << EOF
        Package: tela-circle-manjaro-icons
        Version: $latestTag
        Architecture: all
        Section: x11
        Maintainer: Kazam <kazam0180@proton.me>
        Priority: optional
        Installed-Size: 88584
        Description: A flat, colorful icon theme. Manjaro color.
         https://github.com/vinceliuice/Tela-circle-icon-theme
        EOF

        dpkg-deb --build deb-pkg tela-circle-manjaro-icons_$latestTag.deb

        # Move artifacts
        mkdir -p artifacts
        mv tela-circle-manjaro-icons_$latestTag.deb artifacts/ 2>/dev/null || echo "No deb files found"
        echo "$latestTag" >> artifacts/tag

        echo "Build completed"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tela-circle-manjaro-icons-deb
        path: artifacts/tela*.deb
        retention-days: 7

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tela-circle-manjaro-icons-tag
        path: artifacts/tag
        retention-days: 7

