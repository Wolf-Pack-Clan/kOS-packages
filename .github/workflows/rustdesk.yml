name: RustDesk

on:
  workflow_dispatch:
  workflow_call:
  # Consider uncommenting the line below to run this automatically (e.g., daily at midnight)
  # schedule:
  #   - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  build-rustdesk:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Fetch RustDesk
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends curl jq
        # Dynamically fetch the latest release tag from GitHub API
        LATEST_TAG=$(curl -s https://api.github.com/repos/rustdesk/rustdesk/releases/latest | jq -r .tag_name)
        # Strip a leading 'v' if present (e.g., 'v1.4.7' -> '1.4.7') for clean Debian package naming
        VERSION=${LATEST_TAG#v}
        echo "Fetching RustDesk version: $VERSION (Tag: $LATEST_TAG)"
        wget -O "rustdesk-${VERSION}-x86_64.deb" "https://github.com/rustdesk/rustdesk/releases/download/${LATEST_TAG}/rustdesk-${VERSION}-x86_64.deb"
        mkdir -p artifacts
        mv rustdesk-*.deb artifacts/
        echo "$VERSION" >> artifacts/tag

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: rustdesk-deb
        path: artifacts/rustdesk*.deb
        retention-days: 7

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: rustdesk-tag
        path: artifacts/tag
        retention-days: 7
