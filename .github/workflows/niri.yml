name: Niri

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build-niri:
    runs-on: ubuntu-latest
    #container:
    #  image: debian:trixie

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          devscripts build-essential fakeroot dpkg-dev curl \
          equivs ca-certificates git gnupg rustup pkgconf sudo

        rustup default stable
        sudo bash -c "$(curl -fsSL https://pacstall.dev/q/install)" || sudo bash -c "$(curl -fsSL https://pacstall.dev/q/install)"

    - name: Build Niri
      run: |
        pacstall -I -B --keep niri

        # Move artifacts
        mkdir -p artifacts
        mv *.deb artifacts/ 2>/dev/null || echo "No deb files found"
        pkgver=$(curl -s 'https://raw.githubusercontent.com/pacstall/pacstall-programs/refs/heads/master/packages/niri/niri.pacscript' | sed -n 's/.*pkgver="\([^"]*\)".*/\1/p')
        echo "v$pkgver" >> artifacts/tag

        echo "Build completed"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: niri-deb
        path: artifacts/niri_*.deb
        retention-days: 7

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: niri-tag
        path: artifacts/tag
        retention-days: 7

