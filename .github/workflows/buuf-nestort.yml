name: Buuf Nestort

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build-buuf-nestort-icon-theme:
    runs-on: ubuntu-26.04
    container:
      image: debian:trixie

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup environment
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          sed coreutils gtk-update-icon-cache \
          devscripts fakeroot dpkg-dev git \

        git clone https://git.disroot.org/eudaimon/buuf-nestort.git --single-branch --depth=1
        rm -rf buuf-nestort/.git

    - name: Build Icon Theme
      env:
        DEBEMAIL: kazam0180@proton.me
        DEBFULLNAME: Kazam
        DEBIAN_FRONTEND: noninteractive
      run: |
        latestTag=$(date +'%d.%m.%Y')
        insize=$(du -sk buuf-nestort | cut -f1)

        mkdir -p deb-pkg/DEBIAN
        mkdir -p deb-pkg/usr/share/icons/
        cp -r buuf-nestort deb-pkg/usr/share/icons/

        cat > deb-pkg/DEBIAN/control << EOF
        Package: buuf-nestort-icons
        Version: $latestTag
        Architecture: all
        Section: x11
        Maintainer: Kazam <kazam0180@proton.me>
        Priority: optional
        Installed-Size: $insize
        Description: A fairly complete set of icons for Gnome, KDE Plasma, XFCE, LXQt, Cinnamon and Mate.
         https://git.disroot.org/eudaimon/buuf-nestort
        EOF

        dpkg-deb --build deb-pkg buuf-nestort-icons_$latestTag.deb

        # Move artifacts
        mkdir -p artifacts
        mv buuf-nestort-icons_$latestTag.deb artifacts/ 2>/dev/null || echo "No deb files found"
        echo "$latestTag" >> artifacts/tag

        echo "Build completed"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: buuf-nestort-icons-deb
        path: artifacts/buuf*.deb
        retention-days: 7

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: buuf-nestort-icons-tag
        path: artifacts/tag
        retention-days: 7

