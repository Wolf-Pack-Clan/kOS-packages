name: kOS-welcome

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build-kos-welcome:
    runs-on: ubuntu-26.04
    container:
      image: debian:trixie

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup environment
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          rsync python3-yaml python3-jsonschema devscripts \
          build-essential fakeroot dpkg-dev rustup pkgconf \
          equivs ca-certificates git gnupg libgtk-3-dev

        rustup default stable
        cargo install cargo-deb
        git clone https://gitlab.com/kazamOS/apps/kos-welcome.git

    - name: Build kos-welcome
      env:
        DEBEMAIL: kazam0180@proton.me
        DEBFULLNAME: Kazam
        DEBIAN_FRONTEND: noninteractive
      run: |

        SRCDIR="kos-welcome"
        echo "SRCDIR=${SRCDIR}" >> $GITHUB_ENV
        DEBEMAIL=kazam0180@proton.me
        echo "DEBEMAIL=$DEBEMAIL" >> $GITHUB_ENV

        cd "$SRCDIR"
        latestTag=$(git describe --tags $(git rev-list --tags --max-count=1))
        git checkout $latestTag

        echo "################################################################"
        cat Cargo.toml

        cargo deb

        # Move artifacts
        cd ..
        mkdir -p artifacts
        mv $SRCDIR/target/debian/*.deb artifacts/ 2>/dev/null || echo "No deb files found"
        echo "$latestTag" >> artifacts/tag

        echo "Build completed"

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: kos-welcome-deb
        path: artifacts/kos-welcome*.deb
        retention-days: 7

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: kos-welcome-tag
        path: artifacts/tag
        retention-days: 7

