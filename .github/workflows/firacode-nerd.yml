name: FiraCodeNerd

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build-firacode-nerd:
    runs-on: ubuntu-26.04
    container:
      image: debian:trixie

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup environment
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          dpkg-dev devscripts fakeroot dpkg-dev wget unzip tree \

        wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/FiraCode.zip > /dev/null
        mkdir -p fonts
        cd fonts
        unzip ../FiraCode.zip
        rm ../FiraCode.zip

    - name: Build Theme
      env:
        DEBEMAIL: kazam0180@proton.me
        DEBFULLNAME: Kazam
        DEBIAN_FRONTEND: noninteractive
      run: |

        latestTag="3.4.0"
        insize=$(du -sk fonts | cut -f1)

        mkdir -p deb-pkg/DEBIAN
        mkdir -p deb-pkg/usr/share/fonts/truetype/firacode-nerd
        mkdir -p deb-pkg/usr/share/doc/fonts-firacode-nerd

        mv fonts/*.ttf deb-pkg/usr/share/fonts/truetype/firacode-nerd/
        mv fonts/LICENSE deb-pkg/usr/share/doc/fonts-firacode-nerd/copyright

        cat > deb-pkg/DEBIAN/control << EOF
        Package: fonts-firacode-nerd
        Version: $latestTag
        Architecture: all
        Installed-Size: $insize
        Section: x11
        Maintainer: Kazam <kazam0180@proton.me>
        Priority: optional
        Description: FiraCode Nerd font.
         Source: https://github.com/ryanoasis/nerd-fonts
        EOF

        tree deb-pkg

        dpkg-deb --build deb-pkg fonts-firacode-nerd_$latestTag.deb

        # Move artifacts
        mkdir -p artifacts
        mv fonts-firacode-nerd_$latestTag.deb artifacts/ 2>/dev/null || echo "No deb files found"
        echo "$latestTag" >> artifacts/tag

        echo "Build completed"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: firacode-nerd-deb
        path: artifacts/fonts-firacode*.deb
        retention-days: 7

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: firacode-nerd-tag
        path: artifacts/tag
        retention-days: 7

