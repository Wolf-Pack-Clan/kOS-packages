name: kOS-theme

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build-kos-theme:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup environment
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          meson ninja-build optipng dpkg-dev nodejs npm inkscape parallel \
          devscripts fakeroot dpkg-dev git tree \

        git clone https://gitlab.com/kazamOS/kOS-theme.git

    - name: Build Theme
      env:
        DEBEMAIL: kazam0180@proton.me
        DEBFULLNAME: Kazam
        DEBIAN_FRONTEND: noninteractive
      run: |

        SRCDIR="kOS-theme"
        echo "SRCDIR=${SRCDIR}" >> $GITHUB_ENV

        cd "$SRCDIR"
        latestTag=$(git describe --tags $(git rev-list --tags --max-count=1))
        git checkout $latestTag

        mkdir -p prefix
        meson setup _build -Dprefix="$(realpath ./prefix)" -Dcolors=green,purple -Dschemes=default,dark,light -Dsizes=default,compact
        tree _build/src
        ninja -C _build | grep terminal
        tree _build/src/xfce4-terminal
        ninja -C _build install
        
        insize=$(du -sk prefix | cut -f1)

        mkdir -p deb-pkg/DEBIAN
        mkdir -p deb-pkg/usr
        cp -r prefix/* deb-pkg/usr/

        cat > deb-pkg/DEBIAN/control << EOF
        Package: kos-theme
        Version: $latestTag
        Architecture: all
        Installed-Size: $insize
        Section: x11
        Maintainer: Kazam <kazam0180@proton.me>
        Priority: optional
        Recommends: gtk2-engines-murrine, libgtk-3-common, libgtk2.0-common, libgtk-4-common
        Description: Default theme for kazamOS. Based on Materia.
         It focuses on XFCE desktop environment and LightDM.
        EOF

        dpkg-deb --build deb-pkg kos-theme_$latestTag.deb

        # Move artifacts
        cd ..
        mkdir -p artifacts
        mv $SRCDIR/kos-theme_$latestTag.deb artifacts/ 2>/dev/null || echo "No deb files found"
        echo "$latestTag" >> artifacts/tag

        echo "Build completed"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kos-theme-deb
        path: artifacts/kos*.deb
        retention-days: 7

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kos-theme-tag
        path: artifacts/tag
        retention-days: 7

